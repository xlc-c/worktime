name: Feature request
description: Suggest an improvement or new capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        WorkTime is **local-first**: no cloud, no telemetry, no screenshots/keyboard hooks.
        Features that conflict with this will be declined. For open-ended ideas use Discussions.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow and the pain point, not just a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: UI sketch, behavior, edge cases.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture (windows / browser / clipboard)
        - Timeline & review UI
        - Auto-labeling / local LLM
        - Reports / exports
        - Packaging / deployment
        - Docs / localization
        - Other
