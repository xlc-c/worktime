name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing WorkTime! Please **remove personal data** (real window titles, customer
        names, clipboard text, file paths) from screenshots and logs before posting.
  - type: input
    id: version
    attributes:
      label: WorkTime version
      placeholder: "0.1.0 (or commit hash)"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Portable ZIP (runtime bundled)
        - Python / source checkout
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior, and when it happens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start collector with ...
        2. Open Excel and ...
        3. Run process-today.bat ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `scripts\collect-diagnostics.ps1` (it contains no captured content) and relevant log lines with personal data removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal/company data from this report.
          required: true
