<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkTime · 工作时间线</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">W</span>
    <div>
      <div class="title">WorkTime</div>
      <div class="sub">本机工作时间线</div>
    </div>
  </div>
  <div class="toolbar">
    <label class="field">日期 <input type="date" id="date"></label>
    <button id="btnLoad" class="btn">加载</button>
    <button id="btnReport" class="btn ghost">报告</button>
    <button id="btnReprocess" class="btn ghost">重新处理</button>
    <label class="switch"><input type="checkbox" id="showContent"> 显示复制/粘贴/输入内容</label>
    <button id="btnSettings" class="btn ghost">⚙ 采集设置</button>
    <button id="btnUndo" class="btn ghost" disabled>撤销</button>
  </div>
</header>

<main>
  <section class="stats" id="stats"></section>
  <div class="date-chips" id="dateChips"></div>

  <section class="panel">
    <div class="panel-head">
      <h2>一天概览</h2>
      <span class="hint">颜色 = 事项 · 块内下方 = 正在用的程序 · ⚡ = 可能的打断 · 拖动色块移动、拖边缘改时长、拖到事项打标签</span>
      <div class="zoom">
        <button id="zoomOut" class="btn tiny">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" class="btn tiny">＋</button>
      </div>
    </div>
    <div id="dayStrip" class="day-strip"></div>
    <div class="timeline-wrap" id="timelineWrap">
      <div class="axis" id="axis"></div>
      <div class="lanes" id="lanes"></div>
    </div>
    <div class="matter-dock">
      <div class="dock-title">事项 <span class="hint">（把时间块拖到这里打标签）</span></div>
      <div class="chips" id="matterChips"></div>
      <button id="btnNewMatter" class="chip add">＋ 新事项</button>
    </div>
  </section>

  <section class="grid2">
    <div class="panel">
      <div class="panel-head"><h2>事项占比</h2></div>
      <div id="donut" class="donut-wrap"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>应用用时</h2></div>
      <div id="appBars" class="bars"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>每小时活跃</h2></div>
      <div id="hourBars" class="hours"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>明细</h2>
      <div class="bulk" id="bulkBar">
        <span>已选 <b id="selCount">0</b> 段</span>
        <input id="bulkTask" placeholder="任务（可留空）">
        <input id="bulkMatter" placeholder="事项">
        <button id="btnBulk" class="btn primary">应用</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="list">
        <thead>
          <tr>
            <th class="c"><input type="checkbox" id="checkAll"></th>
            <th>时间</th><th>时长</th><th>应用</th><th>任务</th><th>事项</th>
            <th>置信度</th><th>窗口 / 网页</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <div id="drawerTitle"></div>
    <button id="drawerClose" class="btn tiny">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div id="tooltip" class="tooltip"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden">
  <div class="modal-box report-box">
    <div class="modal-head report-head">
      <h3 id="modalTitle">报告</h3>
      <div class="report-tabs" id="reportTabs">
        <button data-period="day" class="active">日报</button>
        <button data-period="week">周报</button>
        <button data-period="month">月报</button>
        <button data-period="year">年报</button>
      </div>
      <button id="reportDownload" class="btn tiny">下载 .md</button>
      <button id="modalClose" class="btn tiny">✕</button>
    </div>
    <div id="reportCharts" class="report-charts"></div>
    <div id="modalBody" class="report-html"></div>
  </div>
</div>
<div id="settingsModal" class="modal hidden">
  <div class="modal-box settings-box">
    <div class="modal-head">
      <h3>采集范围与权限</h3>
      <button id="settingsClose" class="btn tiny">✕</button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
    <div class="settings-actions">
      <span class="hint" id="settingsNote"></span>
      <button id="settingsSave" class="btn primary">保存</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
