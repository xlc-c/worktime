name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: worktime-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          gh release view android-v0.1.0 >/dev/null 2>&1 || \
            gh release create android-v0.1.0 \
              --title "Android v0.1.0 — 采集 + 今日用量 + 导出" \
              --notes-file android/RELEASE.md --prerelease
          gh release upload android-v0.1.0 "$APK#WorkTime-android-0.1.0-debug.apk" --clobber

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="CI: Android build log"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "$TITLE" --body "Gradle build log tails are posted here as comments, so they are readable without a token." --json number --jq '.number')
          fi
          {
            echo "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```'
            tail -n 120 android/build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } > comment.md
          gh issue comment "$NUM" --body-file comment.md
